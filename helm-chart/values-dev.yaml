# Helm chart values for Development Deployment

replicaCount: 1

scimma:
  authBaseUrl: https://admin.dev.hop.scimma.org/hopauth
  archiveBaseUrl: https://archive-api.dev.hop.scimma.org/
  kafkaBaseUrl: kafka://dev.hop.scimma.org/

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

brokers:
  gcnClassicOverKafka:
    groupId: 'hermes-dev'
  hopskotch:
    groupId: 'hermes-dev'

influxdb:
  enabled: true
  asynchronousMode: true
  measurement: "hermes_dev_requests"
  certSecretName: "hermes-influxdb-certs"

hermesFrontEndBaseUrl: https://hermes-dev.lco.global/

gcnEmail: circulars@dev.gcn.nasa.gov

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx-ingress-public
  hosts:
    - host: hermes-dev.lco.global
      paths:
        - "/api"
        - "/admin"
        - "/auth"
        - "/gcn-auth"
        - "/static"
        - "/get-csrf-token"
        - "/login-redirect"
        - "/logout-redirect"
